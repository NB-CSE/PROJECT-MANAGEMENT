<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>TaskFlow - Redirecting...</title>
    <script type="text/javascript">
      var repo = '/PROJECT-MANAGEMENT';
      var path = window.location.pathname;
      if (path.indexOf(repo) === 0) {
        path = path.substring(repo.length);
      }
      if (!path || path === '/') {
        path = '';
      }
      var target = repo + '/#' + (path.indexOf('/') === 0 ? path : '/' + path) + window.location.search + window.location.hash;
      window.location.replace(target);
    </script>
  </head>
  <body>
  </body>
</html>
